{% extends "base.html" %}
{% block title %}Register - {{ platform_name }}{% endblock %}

{% block auth_content %}
<div class="eg-auth-card">
    <h1 class="eg-auth-heading">Candidate Registration</h1>
    <p class="eg-auth-subheading">Create your account to begin identity verification.</p>

    <form method="POST" action="{{ url_for('auth.register') }}" novalidate autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label for="full_name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="full_name" name="full_name"
                   value="{{ full_name or '' }}" required autofocus autocomplete="off">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ email or '' }}" required autocomplete="off">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   minlength="8" required autocomplete="new-password">
            <div class="form-text">Minimum 8 characters.</div>
        </div>
        <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirm_password"
                   name="confirm_password" minlength="8" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn eg-btn-primary w-100 mt-2">Create Account</button>
    </form>

    <p class="eg-auth-footer">
        Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>
    </p>
</div>
{% endblock %}
