{% extends "base.html" %}
{% block title %}Login - {{ platform_name }}{% endblock %}

{% block auth_content %}
<div class="eg-auth-card">
    <h1 class="eg-auth-heading">Candidate Login</h1>
    <p class="eg-auth-subheading">Sign in to access your secure assessment dashboard.</p>

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ email or '' }}" required autofocus autocomplete="off">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   required autocomplete="new-password">
        </div>
        <button type="submit" class="btn eg-btn-primary w-100 mt-2">Sign In</button>
    </form>

    <p class="eg-auth-footer">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
    </p>
</div>
{% endblock %}
